<html>

  <link rel="manifest" href="manifest.json">

  <meta name="author" content="Karolis Kazlauskis; Soon Chye">

  <meta name="mobile-web-app-capable" content="yes">

  <meta property="og:image:height" content="630">

  <link rel="shortcut icon" sizes="192x192" href="images/Icon-192.png">
  <link rel="apple-touch-icon-precomposed" href="images/AppIcon60x60.png">

  <link rel="apple-touch-icon-precomposed" sizes="76x76" href="images/Icon-76.png">

  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="images/Icon-60@3x.png">
  <link rel="apple-touch-startup-image" href="images/startup.png">

  <!-- CSS -->
  <link type="text/css" rel="stylesheet" href="styles/main.min.css"/>

  <!-- Modern refresh: fonts + styles for the differences / list / species pages -->

  <link type="text/css" rel="stylesheet" href="styles/refresh.css"/>

<body class="loading">
  <div class="loading rf-splash">

      <img src="images/app_logo.png" class="rf-splash-logo"/>
      <div class="rf-splash-title">Dragonflies of Singapore</div>
      <img src="images/sponsor_logo.png" class="rf-splash-sponsor"/>
    </div>
    <div class="loader">
      <img src="images/ajax-loader.gif" />
      <div class="error"><!-- Error while loading --></div>
      <noscript>
        <style type="text/css">
          .loader img {display:none;}
        </style>
        <div class="error">
          Oh no! Looks like you don't have javascript enabled.
        </div>
      </noscript>
    </div>
  </div>

  <script src="scripts/libs/require.min.js" data-main="scripts/main-built"></script>
  <script src="scripts/refresh.js"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>

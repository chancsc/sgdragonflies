<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dragonflies of Singapore — Content Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f5;
    --panel: #ffffff;
    --border: #dfe3dd;
    --text: #1f2a1f;
    --muted: #6b7a6b;
    --accent: #2f7d4f;
    --accent-dark: #235f3b;
    --danger: #b3261e;
    --danger-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header {
    padding: 14px 20px;
    background: var(--accent-dark);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; opacity: .85; }
  #layout {
    display: flex;
    height: calc(100vh - 48px);
  }
  #list-panel {
    width: 320px;
    min-width: 260px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  #search-row {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  #search-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  #add-btn {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #add-btn:hover { background: var(--accent-dark); }
  #species-list {
    flex: 1;
    overflow-y: auto;
  }
  .species-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-bottom: 1px solid #eef1ec;
    cursor: pointer;
  }
  .species-row:hover { background: #f0f5f0; }
  .species-row.selected { background: #e4f2e8; }
  .species-row .names { min-width: 0; }
  .species-row .common { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .species-row .taxon { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: #ddd;
    color: #444;
    margin-left: auto;
    flex-shrink: 0;
  }
  #detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  #empty-state {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .field-row { margin-bottom: 14px; }
  .field-row label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .field-row input[type=text],
  .field-row textarea,
  .field-row select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .field-row textarea { min-height: 70px; resize: vertical; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .three-col { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 0 0 18px;
    padding: 14px 16px;
  }
  legend { font-size: 12px; font-weight: 700; color: var(--accent-dark); padding: 0 6px; }
  .colour-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
  }
  .colour-grid label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: normal;
    text-transform: none;
  }
  .photo-block {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fafbf9;
  }
  .photo-block img {
    width: 72px; height: 72px;
    object-fit: cover;
    border-radius: 6px;
    background: #eee;
    flex-shrink: 0;
  }
  .photo-block .photo-fields { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .photo-block .photo-fields input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }
  .photo-block .remove-photo {
    background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; font-weight: 600;
    align-self: flex-start;
  }
  #add-gallery-btn {
    padding: 6px 12px;
    border: 1px dashed var(--accent);
    border-radius: 6px;
    background: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 13px;
  }
  #action-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  #save-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #save-btn:hover { background: var(--accent-dark); }
  #delete-btn {
    padding: 10px 20px;
    border: 1px solid var(--danger);
    border-radius: 6px;
    background: var(--danger-bg);
    color: var(--danger);
    font-weight: 600;
    cursor: pointer;
  }
  #save-msg { align-self: center; font-size: 13px; color: var(--accent-dark); }
</style>
</head>
<body>
<header>
  <h1>Dragonflies of Singapore — Content Admin</h1>
  <div class="status" id="status-line"></div>
</header>
<div id="layout">
  <div id="list-panel">
    <div id="search-row">
      <input type="text" id="search-input" placeholder="Search name or taxon…">
      <button id="add-btn">+ Add</button>
    </div>
    <div id="species-list"></div>
  </div>
  <div id="detail-panel">
    <div id="empty-state">Select a species on the left, or click "+ Add" to create one.</div>
    <form id="edit-form" hidden></form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
